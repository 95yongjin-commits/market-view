name: 데이터 갱신 및 배포

on:
  schedule:
    # 시간은 UTC 기준 (KST = UTC+9). GitHub 사정상 수 분~수십 분 지연될 수 있음
    - cron: "0 22 * * 0-4"       # 07:00 KST 화~토 아침: 미국장 마감 반영
    - cron: "30 0,2,4 * * 1-5"   # 09:30 / 11:30 / 13:30 KST 장중
    - cron: "10 7 * * 1-5"       # 16:10 KST 국내 장마감
    - cron: "0 9 * * 1-5"        # 18:00 KST 수급 확정치
    - cron: "0 14 * * 1-5"       # 23:00 KST 미국장 개장 후
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["store/**", "web/uploads/**"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Seoul
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 데이터 수집
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
        run: python scripts/collect.py --out web/data --prev "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
